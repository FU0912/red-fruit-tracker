name: RedFruitTracker

options:
  bundleIdPrefix: com.f
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  RedFruitTracker:
    type: application
    platform: iOS
    sources:
      - path: RedFruitTracker/App
      - path: RedFruitTracker/Models
      - path: RedFruitTracker/Features
      - path: RedFruitTracker/Services
      - path: RedFruitTracker/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.f.redfruittracker
        INFOPLIST_FILE: RedFruitTracker/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: RedFruitTracker/Resources/RedFruitTracker.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: RedFruitTrackerShareExtension
        embed: true
      - target: RedFruitTrackerWidget
        embed: true

  RedFruitTrackerShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: RedFruitTrackerShareExtension
      - path: RedFruitTracker/Services/URLExtractor.swift
      - path: RedFruitTracker/Services/ShareInbox.swift
      - path: RedFruitTracker/Services/SharePayloadParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.f.redfruittracker.share
        INFOPLIST_FILE: RedFruitTrackerShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: RedFruitTrackerShareExtension/RedFruitTrackerShareExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  RedFruitTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RedFruitTrackerTests
    dependencies:
      - target: RedFruitTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.f.redfruittracker.tests
        GENERATE_INFOPLIST_FILE: YES

  RedFruitTrackerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RedFruitTrackerWidget
      - path: RedFruitTracker/Services/RecentSeriesWidgetData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.f.redfruittracker.widget
        INFOPLIST_FILE: RedFruitTrackerWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: RedFruitTrackerWidget/RedFruitTrackerWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  RedFruitTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/RedFruitTrackerUITests
    dependencies:
      - target: RedFruitTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.f.redfruittracker.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RedFruitTracker:
    build:
      targets:
        RedFruitTracker: all
        RedFruitTrackerWidget: all
        RedFruitTrackerTests: [test]
        RedFruitTrackerUITests: [test]
    test:
      config: Debug
      targets:
        - name: RedFruitTrackerTests
        - name: RedFruitTrackerUITests
