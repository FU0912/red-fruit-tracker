name: iOS CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      package_only:
        description: Build the device IPA without running simulator tests
        required: false
        default: false
        type: boolean
      startup_compat_only:
        description: Run all unit tests plus the unsigned-startup UI regression
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  simulator:
    runs-on: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project RedFruitTracker.xcodeproj \
            -scheme RedFruitTracker \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-build.log

      - name: Run unit and UI tests
        if: ${{ inputs.package_only != true }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "$device_id" ]; then
            echo "No available iPhone Simulator was found."
            xcrun simctl list devices
            exit 1
          fi
          echo "Using simulator: $device_id"
          test_selection=()
          if [ "${{ inputs.startup_compat_only }}" = "true" ]; then
            test_selection=(
              "-only-testing:RedFruitTrackerTests"
              "-only-testing:RedFruitTrackerUITests/testUnsignedBuildStaysOpenWithoutCloudKitEntitlement"
            )
          fi
          set -o pipefail
          test_status=0
          xcodebuild test \
            -project RedFruitTracker.xcodeproj \
            -scheme RedFruitTracker \
            -destination "platform=iOS Simulator,id=$device_id" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            "${test_selection[@]}" \
            | tee xcodebuild-test.log || test_status=$?
          xcrun simctl io "$device_id" screenshot artifacts/simulator-final.png || true
          exit $test_status

      - name: Package simulator app
        if: always()
        run: |
          app_path="build/DerivedData/Build/Products/Debug-iphonesimulator/RedFruitTracker.app"
          if [ -d "$app_path" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$app_path" artifacts/RedFruitTracker-simulator.app.zip
          else
            echo "Simulator app was not found at $app_path"
          fi

      - name: Build unsigned device archive
        if: success()
        run: |
          set -o pipefail
          xcodebuild archive \
            -project RedFruitTracker.xcodeproj \
            -scheme RedFruitTracker \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Debug \
            -archivePath build/RedFruitTracker.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee xcodebuild-device.log

      - name: Package unsigned device IPA
        if: always()
        run: |
          app_path="build/RedFruitTracker.xcarchive/Products/Applications/RedFruitTracker.app"
          if [ -d "$app_path" ]; then
            mkdir -p build/ipa/Payload
            cp -R "$app_path" build/ipa/Payload/
            short_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")
            build_number=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")
            versioned_path="$GITHUB_WORKSPACE/artifacts/RedFruitTracker-unsigned-device-v${short_version}-build${build_number}.ipa"
            (cd build/ipa && zip -qry "$GITHUB_WORKSPACE/artifacts/RedFruitTracker-unsigned-device.ipa" Payload)
            cp "$GITHUB_WORKSPACE/artifacts/RedFruitTracker-unsigned-device.ipa" "$versioned_path"
          else
            echo "Unsigned device app was not found at $app_path"
          fi

      - name: Verify unsigned package skips CloudKit startup
        if: success()
        run: |
          app_path="build/RedFruitTracker.xcarchive/Products/Applications/RedFruitTracker.app"
          cloudkit_enabled=$(/usr/libexec/PlistBuddy -c 'Print :RedFruitCloudKitEnabled' "$app_path/Info.plist")
          if [ "$cloudkit_enabled" != "false" ]; then
            echo "Unsigned package must keep RedFruitCloudKitEnabled=false."
            exit 1
          fi

      - name: Publish unsigned IPA prerelease
        if: success() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ipa_path="$(find artifacts -maxdepth 1 -name 'RedFruitTracker-unsigned-device-v*-build*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo "Versioned unsigned IPA was not found."
            exit 1
          fi
          app_path="build/RedFruitTracker.xcarchive/Products/Applications/RedFruitTracker.app"
          short_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")
          build_number=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")
          tag="v${short_version}-build${build_number}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "RedFruitTracker v${short_version} (build ${build_number})" \
              --notes "Unsigned device IPA produced by iOS CI. Sign it with your own Apple ID before installing on a real iPhone." \
              --prerelease
          fi
          gh release upload "$tag" "$ipa_path" --clobber

      - name: Export test attachments
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            mkdir -p artifacts/attachments
            xcrun xcresulttool export attachments \
              --path TestResults.xcresult \
              --output-path artifacts/attachments || true
          fi

      - name: Upload build and UI artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-artifacts
          if-no-files-found: warn
          path: |
            xcodebuild-build.log
            xcodebuild-test.log
            xcodebuild-device.log
            TestResults.xcresult
            artifacts
